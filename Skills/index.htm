<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skills</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        nav {
            text-align: center;
            align-content: center;
            height: 84px;
            background-color: rgb(4, 4, 57);
            color: white;
            font-family: Cambria, Cochin, Georgia, Times, 'Times New Roman', serif;

        }

        h3 {
            margin: 74px 0;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            font-size: 25px;

        }

        .container {
            display: grid;
            gap: 10px;
            /* grid-template-rows: repeat(); */

            justify-content: center;
            /* height: 150vh;
            width: 100vh; */
            /* align-content: center;
            margin: 0 64vh; */

        }

        .box {
            text-align: center;
            font-size: 22px;
            font-family: monospace;
            color: rgb(14, 14, 255);

            border: 3px solid rgb(47, 33, 116);
            background-color: rgb(236, 236, 239);
            height: 100px;
            width: 80vh;
            margin: 25px;
            padding: 25px;
            box-shadow: 0 0 10px;
        }

        .box:hover {
            border: 3.5px solid rgb(0, 213, 255);
            background-color: rgb(4, 4, 57);
            color: solid white;
        }

        p {
            margin: 20px 0;
            font-size: smaller;
            color: rgb(67, 67, 119);
        }
         .rec {
            position: relative;
            top: 20px;
            padding: 10px 0;
            margin: 20px 0;
            text-align: center;
            color: grey;
            border: solid black 3px;
            background-color: black;
        }

            </div>

                </p>
            </div>
            <div class="box">
